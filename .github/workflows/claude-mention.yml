name: Claude — @claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write
jobs:
  claude:
    if: >
      vars.CLAUDE_AUTOMATION == 'on' &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: tools
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          branch_prefix: claude/
          claude_args: >-
            --model sonnet
            --max-turns 100
            --allowedTools "Read,Grep,Glob,Write,Edit,Bash(git:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(python3:*)"
      - if: always() && (github.event.issue.pull_request || github.event.pull_request)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          REF=$(gh pr view "$N" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$REF"
